        <article>
          <h1>How we built enqueue, retry, and dedup in a Go DAG scheduler</h1>
          <p><time datetime="2026-08-12">2026-08-12</time> · Tech</p>
          <p><strong>Dagu</strong> is an open-source, local-first workflow orchestrator (YAML DAGs, scheduler, queues, UI). I contribute Go backend + UI to <a href="https://github.com/dagucloud/dagu">dagucloud/dagu</a> (formerly <code>dagu-org</code> / <code>yohamta</code>). This post covers three problems that show up once “run a DAG” becomes a <strong>durable work queue</strong>: enqueue routing, capacity-aware retries, and keeping runs reproducible / non-duplicated.</p>
<p>I’m a contributor, not the sole author. Queues in Dagu didn’t start as an OSS feature request — they started as a production need for <strong>satellite raw-data image processing</strong> (realtime ingest + bulk reprocess). We built and stress-tested the queue inside our org, then pitched it to maintainer <a href="https://github.com/yohamta">@yota-hamada</a>. That path is <a href="https://github.com/dagucloud/dagu/pull/690">#690</a> → <a href="https://github.com/dagucloud/dagu/issues/938">#938</a> → co-authored landing in <a href="https://github.com/dagucloud/dagu/pull/940">#940</a> / <a href="https://github.com/dagucloud/dagu/commit/b98063dd874acdea7745a985e714b1f3b9f97754"><code>b98063d</code></a>. Links below are my follow-on merged PRs on routing, capacity-aware retry, and reproducibility. Adjacent features (singleton enqueue, cursor pagination, SSE) are later maintainer work and noted as such.</p>
<hr>
<h2>The shape of the problem</h2>
<p>A DAG scheduler has to answer:</p>
<ol>
<li><strong>Where does this run go?</strong> (which queue / priority)</li>
<li><strong>What happens when it fails?</strong> (retry now vs later, under what policy)</li>
<li><strong>How do we avoid duplicate or drifted runs?</strong> (same identity, locked params, capacity honesty)</li>
</ol>
<p>Naive answers (“just start the process”) break under load: retries bypass capacity, queue config stuck in YAML can’t handle “replay on the low-priority queue,” and any nonzero exit gets treated the same.</p>
<figure class="mermaid-figure"><img src="/diagrams/enqueue-retry-dedup/0.svg" alt="Diagram" class="mermaid-diagram" loading="lazy" /></figure><hr>
<h2>Origin: satellite pipelines, then upstream</h2>
<p>We run Dagu on <strong>satellite raw-data image processing</strong>: realtime streams when a pass lands, and occasional <strong>reprocess</strong> jobs that dump a huge historical chunk back through the same DAGs. Capacity is the hard part — too many concurrent runs and the workers melt; too few and the downlink backlog grows.</p>
<p><strong>Before queues existed in Dagu</strong>, we bolted on a sidecar microservice: watch how many DAGs are running, and only ingest/start new work when under a limit. That gated starts, but it was a blind spot for everything waiting. Operators couldn’t tell <strong>running vs queued vs stuck</strong>, reprocess floods looked the same as realtime, and the control loop lived outside the orchestrator — another service to deploy, another source of truth to distrust under load.</p>
<p>So we <strong>implemented a real queue inside Dagu in our org</strong>, stress-tested it on production traffic (realtime + bulk reprocess), and only then pitched the design to maintainer <a href="https://github.com/yohamta">@yota-hamada</a>.</p>
<p>That production prototype is <a href="https://github.com/dagucloud/dagu/pull/690">#690</a>: file-backed queue + running-count stats, a path so dequeued work went straight to running, and <code>DAGQueueLength</code>. It ran with multiple concurrent DAGs in prod; upstream closed the PR as too large to review in one shot — fair for reviewability, painful when you’ve already proven it under satellite load.</p>
<p>The work didn’t die. Issue <a href="https://github.com/dagucloud/dagu/issues/938">#938</a> cites <code>#690</code> as the initial implementation and absorbed ideas we needed in ops: <strong>config toggle to enable/disable queuing</strong>, and <strong>dequeue</strong> so you can cancel work still waiting (critical when a bad reprocess batch is filling the pipe).</p>
<p>Queues landed in main as <a href="https://github.com/dagucloud/dagu/pull/940">#940</a> (<a href="https://github.com/dagucloud/dagu/commit/b98063dd874acdea7745a985e714b1f3b9f97754"><code>b98063d</code></a>). The commit records the lineage in the open:</p>
<blockquote>
<p>Original implementation by Kriyanshi: …/pull/690<br>
Co-authored-by: Kriyanshi Shah</p>
</blockquote>
<p>What that change introduced (the foundation everything below builds on):</p>
<ul>
<li><strong><code>Queued</code> status</strong> (API + scheduler) — waiting work is first-class, not a fake “not started”</li>
<li><strong>CLI <code>enqueue</code> / <code>dequeue</code></strong> — create a run as Queued, persist it, push/pop via <code>QueueStore</code></li>
<li><strong>File-backed <code>DualQueue</code></strong> — high/low priority item files under a per-DAG queue dir (local-first, no Redis)</li>
<li><strong>Scheduler queue reader + processor</strong> — drain when concurrency allows, with a <code>ProcStore</code> for live process tracking</li>
<li><strong>Paths + UI</strong> — <code>queueDir</code> / <code>procDir</code>, Queued chips, workflow actions wired to the new status</li>
</ul>
<p>Lineage in one line: <strong>satellite prod pain → in-org implementation + stress test → pitch to Yota → co-authored upstream</strong>. The rest of this post is what I built on top once queues lived in main: routing overrides (realtime vs reprocess queues), retries that honor capacity, and locks so bulk science/reprocess runs stay reproducible.</p>
<h2>1. Enqueue is a first-class path (not a side door)</h2>
<p><strong>Queue override.</strong> DAG YAML can declare a default queue, but operators often need this run on a different queue (backfill vs realtime) without editing the file.</p>
<p>Design:</p>
<ul>
<li>Persist an optional <code>Queue</code> on run status at enqueue time</li>
<li>Resolution order: <strong>stored override → DAG YAML <code>queue</code> → DAG name</strong></li>
</ul>
<pre><code class="language-bash">dagu enqueue --queue=&quot;realtime&quot; data_processor.yaml
</code></pre>
<p>PR: <a href="https://github.com/dagucloud/dagu/pull/1240">#1240 Add Queue Override Support for DAG Enqueue Operations</a></p>
<p><strong>Enqueue from a spec.</strong> API to enqueue a DAG-run from inline YAML (not only a file on disk) — useful for automation that composes runs dynamically.</p>
<p>PR: <a href="https://github.com/dagucloud/dagu/pull/1375">#1375 New API endpoint for enqueuing a DAGRun from a spec</a></p>
<p><strong>Operator hygiene.</strong> Clear a queue; dequeue must pass the queue name (<code>ProcGroup</code>) or items get lost.</p>
<p>PRs: <a href="https://github.com/dagucloud/dagu/pull/1299">#1299 clear queue</a>, <a href="https://github.com/dagucloud/dagu/pull/1481">#1481 include queue name in dequeue</a></p>
<hr>
<h2>2. Retry must respect the same capacity as enqueue</h2>
<p>The bug class: <strong>retry ran immediately and skipped global queue capacity.</strong></p>
<p>Symptom: capacity = 3, but after retries you’d see 4 running. UI and scheduler disagreed. “Retry = start again” was wrong once queues existed.</p>
<p>Fix for DAGs on a global queue:</p>
<ul>
<li>Mark attempt <strong>Queued</strong>, stamp queue metadata, trigger type = Retry</li>
<li>Enqueue at <strong>low priority</strong></li>
<li>Let the queue processor start it when capacity exists</li>
<li>Step-level retry still runs immediately (processor doesn’t carry step context)</li>
</ul>
<figure class="mermaid-figure"><img src="/diagrams/enqueue-retry-dedup/1.svg" alt="Diagram" class="mermaid-diagram" loading="lazy" /></figure><p>PR: <a href="https://github.com/dagucloud/dagu/pull/1676">#1676 scheduler: respect global queue capacity on retry</a></p>
<p><strong>Exit-code-aware step retry.</strong> Retries shouldn’t fire on every failure. Step <code>retry_policy</code> can allowlist exit codes — retry on 429/503, fail fast otherwise.</p>
<pre><code class="language-yaml">steps:
  - run: curl https://api.example.com/data
    retry_policy:
      limit: 6
      interval_sec: 1
      exit_code: [429, 503]
</code></pre>
<p>PR: <a href="https://github.com/dagucloud/dagu/pull/902">#902 custom exit codes on retry</a></p>
<p>Also: disable step-retry controls while the parent DAG is still running (<a href="https://github.com/dagucloud/dagu/pull/1447">#1447</a>).</p>
<hr>
<h2>3. Dedup and reproducibility</h2>
<p><strong>Parameter / run-ID locking.</strong> For backfills, science pipelines, and audits, params and run identity shouldn’t drift in the UI mid-flight:</p>
<pre><code class="language-yaml">run_config:
  disable_param_edit: true
  disable_run_id_edit: true
</code></pre>
<p>PR: <a href="https://github.com/dagucloud/dagu/pull/1176">#1176 Add DAG configuration to lock parameters and run ID</a></p>
<p><strong>Attempt identity on enqueue.</strong> Enqueue checks for an existing attempt before creating one — same DAG + run ID already exists ⇒ refuse. That store-backed identity is the foundation; opt-in <strong>singleton</strong> (409 if already running/queued) later landed as maintainer work (<a href="https://github.com/dagucloud/dagu/pull/1483">#1483</a>) on top of the same problem space. Lesson: check-then-act alone is TOCTOU; real uniqueness needs store semantics.</p>
<hr>
<h2>Status UX (supporting cast)</h2>
<ul>
<li>Configurable “latest status” window (<a href="https://github.com/dagucloud/dagu/pull/558">#558</a>)</li>
<li>Fix DAG list truncation from a hardcoded paginator cap (<a href="https://github.com/dagucloud/dagu/pull/1126">#1126</a>)</li>
<li>Running/failed step names on run summaries for faster triage (<a href="https://github.com/dagucloud/dagu/pull/1420">#1420</a>)</li>
</ul>
<p>Cursor pagination and SSE live updates were maintainer follow-ons — they scale the UI without changing the queue/retry core.</p>
<hr>
<h2>Tradeoffs I’d make again</h2>
<table>
<thead>
<tr>
<th>Choice</th>
<th>Why</th>
<th>Cost</th>
</tr>
</thead>
<tbody>
<tr>
<td>Retries go through the queue</td>
<td>Capacity stays honest; UI matches reality</td>
<td>Slightly higher latency to restart</td>
</tr>
<tr>
<td>Persist queue override on status</td>
<td>Routing survives restarts / processor hops</td>
<td>Extra field + resolution rules</td>
</tr>
<tr>
<td>Lock params / run ID</td>
<td>Reproducibility for batch &amp; science</td>
<td>Less “edit and hot-retry” flexibility</td>
</tr>
<tr>
<td>Exit-code allowlist on retry</td>
<td>Fewer useless retries</td>
<td>Authors must document exit contracts</td>
</tr>
<tr>
<td>File-backed queues</td>
<td>Simple local-first ops</td>
<td>Harder atomic singleton than Redis</td>
</tr>
</tbody>
</table>
<hr>
<h2>Why this matters for platform / workflow hiring</h2>
<p>Same problem space as Temporal task queues, K8s job controllers, and CI runners — and the same shape we hit on satellite ingest: <strong>admit work, bound concurrency, see running vs queued clearly, retries that don’t stampede, reproducible dispatch for bulk reprocess.</strong></p>
