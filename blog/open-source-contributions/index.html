          <h1>Open Source Contributions to Dagu</h1>
          <p><time datetime="2026-01-26">2026-01-26</time> · Tech</p>
          <p><em>This post complements my other writing on <a href="https://github.com/dagucloud/dagu">Dagu</a>, including <a href="/blog/enqueue-retry-dedup">enqueue, retry, and dedup</a>, <a href="/blog/partial-success">partial success in DAG systems</a>, and <a href="/blog/blog-ssh-executor">using the SSH executor</a>. Where those posts explain how Dagu works, this one documents what I’ve contributed upstream.</em></p>
<h2>Introduction</h2>
<p>I started contributing to <a href="https://github.com/dagucloud/dagu">Dagu</a> in early 2024. Dagu is a self-contained workflow orchestration engine — DAG-based, YAML-defined, and shipped as a single Go binary with a built-in web UI. It sits in a familiar space: lighter than Airflow, more capable than Cron, and practical for teams that want orchestration without standing up a heavy control plane.</p>
<p>The largest piece of work was <strong>co-authoring Dagu’s queue management system</strong>, shipped in <a href="https://docs.dagu.sh/overview/changelog#v1170-2025-06-18">v1.17.0</a> and credited in the official changelog under <em>Queue functionality implementation</em>. Since then I’ve landed <strong>20 merged pull requests</strong>, with <strong>16 GitHub release credits</strong> across 8 release pages — often co-authored with maintainer Yota Hamada.</p>
<p>This post is a map of that work: what shipped, where it was credited, and what’s still in flight.</p>

<p>Activity was sparse in 2024, then accelerated through 2025 — with a major queue merge in <strong>May 2025</strong>, a busy <strong>November 2025</strong> (API, jq executor, timeouts, DAG runs UI), and <strong>February–May 2026</strong> (Helm chart, scheduler capacity fixes, schema param defaults).</p>
<hr>
<h2>About Dagu</h2>
<p>Dagu runs workflows defined as directed acyclic graphs in YAML. A single binary handles scheduling, execution, and the web UI — no external database required. It supports local, queue-based, and distributed execution, with 18+ built-in step executors: shell, Docker, HTTP, SSH, jq, SQL, sub-DAGs, and more.</p>
<p><strong>Stack:</strong> Go 1.26 · React 19 · TypeScript · Chi (REST) · gRPC · OpenAPI · Helm · Tailwind CSS</p>
<p>If you’re new to the project, the <a href="https://docs.dagu.sh">docs</a> are a good starting point.</p>
<hr>
<h2>Featured Contributions</h2>
<h3>Queue Management System — <a href="https://docs.dagu.sh/overview/changelog#v1170-2025-06-18">v1.17.0</a> · Co-authored <a href="https://github.com/dagucloud/dagu/pull/940">#940</a></h3>
<p><strong>Original implementation:</strong> <a href="https://github.com/dagu-org/dagu/pull/690">#690</a> (issue <a href="https://github.com/dagucloud/dagu/issues/535">#535</a>)<br>
<strong>Merged to main:</strong> May 24, 2025 · <strong>Released in:</strong> <a href="https://docs.dagu.sh/overview/changelog#v1170-2025-06-18">v1.17.0 (June 18, 2025)</a></p>
<p>Co-authored the core queue system that lets Dagu run workflows with controlled concurrency — one of the project’s major v1.17.0 features. The official changelog credits <strong>@kriyanshii</strong> under <em>Queue functionality implementation</em>.</p>
<p>What it introduced:</p>
<ul>
<li><code>dagu enqueue</code> / <code>dagu dequeue</code> CLI commands</li>
<li>File-based persistent queue with priority and standard queues</li>
<li><code>Queued</code> workflow status and scheduler queue worker</li>
<li>Queue management UI (enqueue/dequeue from the Web UI)</li>
<li>Enqueue API for programmatic queueing</li>
</ul>
<p>Foundational load-control primitive — queues, concurrency limits, and distributed workers all build on it. Original prototype ~847 lines across 21 files; shipped via <a href="https://github.com/dagucloud/dagu/pull/940">#940</a> with ~5,200 lines across 115 files. Co-authored with Yota Hamada (integration &amp; merge).</p>
<hr>
<h3>Production-Ready Helm Chart for Kubernetes — <a href="https://github.com/dagucloud/dagu/pull/1613">#1613</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v2.0.2">v2.0.2</a></h3>
<p>Complete Helm chart for deploying Dagu on Kubernetes — configurable values, service definitions, and deployment templates. First-class K8s install path: <strong>16 files, ~683 lines added</strong>.</p>
<hr>
<h3>Scheduler Global Queue Capacity on Retry — <a href="https://github.com/dagucloud/dagu/pull/1676">#1676</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v2.0.2">v2.0.2</a></h3>
<p>Retries now respect global queue capacity limits, preventing overflow when failed runs are re-queued. <strong>13 files, ~497 lines.</strong> Co-authored with Yota Hamada.</p>
<hr>
<h3>Enqueue DAGRun from Spec API — <a href="https://github.com/dagucloud/dagu/pull/1375">#1375</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.24.0">v1.24.0</a></h3>
<p>REST endpoint to enqueue a DAG run from a YAML spec, without a pre-existing on-disk DAG file. <strong>5 files, ~648 lines.</strong> Co-authored with Yota Hamada.</p>
<hr>
<h3>jq Executor <code>raw-output</code> Option — <a href="https://github.com/dagucloud/dagu/pull/1392">#1392</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.24.2">v1.24.2</a></h3>
<p><code>raw-output</code> option for unquoted string output, matching <code>jq -r</code> behavior. <strong>3 files, ~634 lines</strong> including tests. Co-authored with Yota Hamada.</p>
<hr>
<h3>Step-Level <code>timeoutSec</code> — <a href="https://github.com/dagucloud/dagu/pull/1412">#1412</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.24.8">v1.24.8</a></h3>
<p>Per-step timeout configuration, independent of DAG-level timeouts. <strong>15 files, ~440 lines.</strong> Co-authored with Yota Hamada.</p>
<hr>
<h3>Custom Exit Codes on Retry — <a href="https://github.com/dagucloud/dagu/pull/902">#902</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.16.8">v1.16.8</a></h3>
<p>Define which exit codes trigger a step retry — retry on transient failures, not expected ones. <strong>7 files, ~624 lines.</strong></p>
<hr>
<h3>Lock Parameters and Run ID — <a href="https://github.com/dagucloud/dagu/pull/1176">#1176</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.20.0">v1.20.0</a></h3>
<p>DAG-level config to lock parameters and run IDs during re-runs or scheduled executions. <strong>12 files, ~383 lines.</strong> Co-authored with Yota Hamada.</p>
<hr>
<h3>Clear Queue Functionality — <a href="https://github.com/dagucloud/dagu/pull/1299">#1299</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.22.10">v1.22.10</a></h3>
<p>REST API plus UI controls on <code>/queues</code> for draining stuck queue entries. <strong>4 files, ~262 lines.</strong> Co-authored with Yota Hamada.</p>
<hr>
<h3>Running/Failed Steps on DAG Runs Page — <a href="https://github.com/dagucloud/dagu/pull/1420">#1420</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.24.11">v1.24.11</a></h3>
<p>Inline running and failed step names on the DAG runs list — faster triage without drilling into details. <strong>4 files, ~177 lines.</strong></p>
<hr>
<h3>Queue Override on Enqueue — <a href="https://github.com/dagucloud/dagu/pull/1240">#1240</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.22.3">v1.22.3</a></h3>
<p>Override the target queue when enqueuing a DAG run, via CLI flag and API request body. <strong>15 files, ~118 lines.</strong></p>
<hr>
<h3><code>--from-run-id</code> CLI Flag — Co-authored <a href="https://github.com/dagucloud/dagu/pull/1378">#1378</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.24.0">v1.24.0</a></h3>
<p><code>--from-run-id</code> on the <code>start</code> command — new runs inherit context from a previous DAG run history entry. Co-authored with Yota Hamada.</p>
<hr>
<h3>Disable Step Retry While DAG Is Running — <a href="https://github.com/dagucloud/dagu/pull/1447">#1447</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.26.2">v1.26.2</a></h3>
<p>Disabled per-step retry controls in the Web UI during active execution — avoids conflicting retry actions mid-run. <strong>1 file, ~10 lines.</strong></p>
<hr>
<h3>Fix Dequeue Queue Name in Runtime — <a href="https://github.com/dagucloud/dagu/pull/1481">#1481</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v1.26.4">v1.26.4</a></h3>
<p>Fixed the runtime <code>Dequeue</code> command builder to pass the queue name as a positional argument. API-initiated dequeue was failing because the CLI expected <code>dagu dequeue &lt;queue-name&gt;</code> but the name was omitted. <strong>2 files, ~23 lines.</strong></p>
<hr>
<h3>Fix Empty Schema Params for Eval Defaults — <a href="https://github.com/dagucloud/dagu/pull/2173">#2173</a> · <a href="https://github.com/dagucloud/dagu/releases/tag/v2.7.2">v2.7.2</a></h3>
<p>Start/Enqueue modal now omits empty parameter values from the request payload, so eval-backed defaults (e.g. <code>${NOW}</code>) resolve correctly instead of being overridden by blank strings. <strong>2 files, ~20 lines.</strong></p>

<li><strong>Testing:</strong> Executor test suites, API integration patterns, race-detection CI compatibility</li>

</ul>
