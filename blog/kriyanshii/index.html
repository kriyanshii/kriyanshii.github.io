          <h2>🌿 About Me</h2>
<p>I work at the <strong>Space Applications Center, ISRO</strong>,<br>
where I contribute to a <strong>Golang-based scheduler</strong> —<br>
a system with a clean web interface and orchestration logic,<br>
built as an <em>alternative to Airflow</em>.</p>
<p>Alongside this, I work on <strong>interactive computing environments</strong> —<br>
systems that let researchers explore data, run experiments,<br>
and turn complex analyses into shareable, reproducible notebooks.</p>
<p>My focus is on <strong>bridging infrastructure and experience</strong> —<br>
making computation feel <em>alive</em>, <em>collaborative</em>, and <em>approachable</em>.</p>
<hr>
<p>Beyond code, I’m drawn to slower, grounding things:</p>
<ul>
<li>🎶 Playing the flute</li>
<li>🌳 Identifying and planting trees</li>
<li>🍰 Baking cupcakes and cakes on weekends</li>
<li>📚 Reading essays and quiet books</li>
</ul>
<hr>
<p><em>I like building things that feel thoughtful and precise —</em><br>
<em>systems that do their job, beautifully.</em></p>
<p><strong>→ Let’s build something lasting.</strong></p>
