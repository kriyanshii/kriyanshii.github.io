          <h1>Interactive Computing Environments</h1>
          <p><time datetime="2025-09-23">2025-09-23</time> · Tech</p>
          <h2>Introduction</h2>
<p>Open Science is transforming how research is conducted, shared, and reused across the globe.<br>
In India, where diverse scientific communities work on domains ranging from <strong>planetary science</strong> to <strong>meteorology</strong>, the need for scalable, reproducible, and accessible research platforms is stronger than ever.</p>
<p>To address this, I designed and developed a <strong>cloud-native, Free and Open Source Software (FOSS)-powered platform</strong> that lowers the barriers for scientists to adopt open, reproducible workflows.</p>
<p>This blog post outlines the motivation, architecture, and impact of this project.</p>
<hr>
<h2>Challenges in Scientific Computing</h2>
<p>Researchers in India face several challenges when working with scientific data and tools:</p>
<ul>
<li>Complex setup of software environments across different domains.</li>
<li>Limited access to scalable infrastructure.</li>
<li>Difficulty in converting computational notebooks into shareable tools.</li>
<li>Fragmentation in adopting FOSS workflows.</li>
</ul>
<p>These challenges slow down reproducible science and collaboration.<br>
Our solution aims to solve these problems using open-source technologies.</p>
<hr>
<h2>The Solution: Scalable Interactive Environments</h2>
<p>At the core of the platform is <strong>JupyterHub</strong>, deployed on <strong>Kubernetes</strong>, which provides a scalable environment for interactive computing.<br>
Each researcher logs into a web-based portal and gets access to a <strong>customized containerized workspace</strong>.</p>
<p>Key features:</p>
<ul>
<li><strong>Custom Docker Images</strong>: Domain-specific environments (e.g., planetary science, meteorology) preloaded with required libraries.</li>
<li><strong>Shared Data Volumes</strong>: Mounted with satellite datasets to allow direct access to scientific data.</li>
<li><strong>Secure &amp; Scalable Pods</strong>: Managed by Kubernetes using <strong>KubeSpawner</strong>, ensuring isolation and resource allocation.</li>
</ul>
<hr>
<h2>Enhancing Interactivity with Mercury</h2>
<p>While Jupyter Notebooks are powerful, sharing results often requires additional steps.<br>
To bridge this gap, I integrated <strong>Mercury</strong>, an open-source library, into the JupyterLab environment.</p>
<h3>Custom Mercury Enhancements</h3>
<ul>
<li>Integrated Mercury inside <strong>multi-user JupyterHub setup</strong>.</li>
<li>Added support for <strong>RESTful APIs</strong>.</li>
<li>Built <strong>custom JupyterLab extensions</strong> to let users create, update, and delete Mercury web apps through a graphical interface.</li>
</ul>
<p>This enables researchers to <strong>convert notebooks into web applications</strong> seamlessly, making their analyses interactive and shareable with peers.</p>
<hr>
<h2>Supporting Tools and Integrations</h2>
<p>The platform leverages several open-source components:</p>
<ul>
<li><strong>JupyterHub</strong> – Web interface for multi-user access.</li>
<li><strong>Kubernetes + KubeSpawner</strong> – Scalable orchestration of user pods.</li>
<li><strong>Docker</strong> – Containerization of domain-specific environments.</li>
<li><strong>JupyterLab</strong> – Interactive computing workspace.</li>
<li><strong>Jupyter Server Proxy</strong> – Secure access to additional services within JupyterHub.</li>
<li><strong>Mercury (custom build)</strong> – Notebook-to-webapp conversion, enhanced for multi-user workflows.</li>
<li><strong>JupyterLab Extensions</strong> – Simplified UI for managing Mercury apps.</li>
</ul>
